#giturl: "https://github.com/BrAiNeeBug/BrAiNPlug"
#BrAiNPlug min.Version 1.6.2
substitutions:
  device_name: brainplug
  friendly_name: "pwrmeter_brainplug"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

globals:
  - id: energy_integration_prev
    type: float
    restore_value: false
    initial_value: "0"
  - id: energy_total
    type: float
    restore_value: true
    initial_value: "0"

#disable this if you dont have esp32
esp32_ble_server:
  services:
    - uuid: a36c6568-2877-466d-ad19-bdbf301199a8
      advertise: false
      characteristics:
        - id: ble_power_char
          uuid: 18074a57-a3ba-49a6-a958-d49525bb9434
          read: true
          value:
            data: !lambda |-
              if (!id(ble_authed)) return std::vector<uint8_t>{};
              return bytebuffer::ByteBuffer::wrap(id(power_sensor).state).get_data();
        - id: ble_voltage_char
          uuid: eef5b493-e0b5-4257-b79f-5945b52fc4b4
          read: true
          value:
            data: !lambda |-
              if (!id(ble_authed)) return std::vector<uint8_t>{};
              return bytebuffer::ByteBuffer::wrap(id(voltage_sensor).state).get_data();
        - id: ble_current_char
          uuid: e512c5a0-e726-478f-94ae-e19218f60118
          read: true
          value:
            data: !lambda |-
              if (!id(ble_authed)) return std::vector<uint8_t>{};
              return bytebuffer::ByteBuffer::wrap(id(current_sensor).state).get_data();
        - id: ble_energy_char
          uuid: d3134b34-4635-4d72-9e50-49053be2bc19
          read: true
          value:
            data: !lambda |-
              if (!id(ble_authed)) return std::vector<uint8_t>{};
              return bytebuffer::ByteBuffer::wrap(id(total_energy_display).state).get_data();

sensor:
  - platform: hlw8012
    model: bl0937
    sel_pin:
      number: ${sel_pin}
      inverted: true
    cf_pin: ${cf_pin}
    cf1_pin: ${cf1_pin}
    voltage_divider: ${voltage_divider}
    current_resistor: ${current_resistor}
    voltage:
      id: voltage_sensor
      name: "Voltage"
      web_server:
        sorting_weight: 2
      icon: "mdi:sine-wave"
    current:
      id: current_sensor
      name: "Current"
      web_server:
        sorting_weight: 3
      icon: "mdi:current-ac"
    power:
      id: power_sensor
      name: "Power"
      filters:
        - multiply: ${power_multiply}
      web_server:
        sorting_weight: 4
      icon: "mdi:lightning-bolt"
    update_interval: 5s
  - platform: integration
    id: energy_integration
    internal: true
    sensor: power_sensor
    time_unit: h
    filters:
      - multiply: 0.001  # Wh -> kWh
    on_value:
      then:
        - lambda: |-
            float delta = x - id(energy_integration_prev);
            if (delta < 0) delta = 0;
            id(energy_total) += delta;
            id(energy_integration_prev) = x;

  - platform: template
    name: "TotalEnergy"
    id: total_energy_display
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: 15s
    lambda: |-
      return id(energy_total);
    icon: "mdi:home-lightning-bolt"
    web_server:
      sorting_weight: 5

button:
  - platform: template
    name: "ResetTotalEnergy"
    id: reset_total_energy_button
    icon: "mdi:restart-alert"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(energy_total) = 0;
          id(energy_integration_prev) = id(energy_integration).state;
          global_preferences->sync();

    disabled_by_default: true