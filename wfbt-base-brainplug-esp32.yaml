#############################################
##########  Plug: Relay/Button/LED  ##########
#############################################

output:
  - platform: gpio
    pin: ${relay_pin}
    id: relay_out
  - platform: gpio
    pin:
      number: ${led_pin}
      inverted: true
      ignore_strapping_warning: true
    id: led_out

switch:
  - platform: output
    name: "RelayPhysical"
    output: relay_out
    id: relay_physical
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          id(relay_state) = 1;
          auto now = id(timesrc).now();
          if (now.is_valid()) {
            id(last_switch_time) = (int) now.timestamp;
          }
          id(relay).publish_state(true);
      - ble_server.characteristic.notify:
          id: ble_relay_char
    on_turn_off:
      - lambda: |-
          id(relay_state) = 0;
          auto now = id(timesrc).now();
          if (now.is_valid()) {
            id(last_switch_time) = (int) now.timestamp;
          }
          id(relay).publish_state(false);
      - ble_server.characteristic.notify:
          id: ble_relay_char
  - platform: template
    name: "Switch"
    id: relay
    restore_mode: DISABLED  # reiner Anzeige-/Gate-Layer, echter Zustand kommt von relay_physical
    icon: "mdi:power-socket-eu"
    turn_on_action:
      - lambda: |-
          if (id(child_lock).state) {
            ESP_LOGW("childlock", "Turn ON blocked - ChildLock active");
            id(relay).publish_state(id(relay_physical).state);
          } else {
            id(relay_physical).turn_on();
          }
    turn_off_action:
      - lambda: |-
          if (id(child_lock).state) {
            ESP_LOGW("childlock", "Turn OFF blocked - ChildLock active");
            id(relay).publish_state(id(relay_physical).state);
          } else {
            id(relay_physical).turn_off();
          }
    web_server:
      sorting_weight: 1
    device_class: outlet
  - platform: template
    name: "Bluetooth"
    id: bluetooth_enable
    icon: "mdi:bluetooth"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - if:
          condition:
            lambda: 'return id(booted_flag);'
          then:
            - if:
                condition:
                  lambda: 'return id(ble_ever_enabled);'
                then:
                  - lambda: |-
                      global_preferences->sync();
                      App.safe_reboot();
                else:
                  - lambda: 'id(ble_ever_enabled) = true;'
                  - ble.enable:
    on_turn_off:
      - ble.disable:
    web_server:
      sorting_weight: 1
  - platform: template
    name: "ChildLock"
    id: child_lock
    icon: "mdi:lock"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - ble_server.characteristic.notify:
          id: ble_childlock_char
    on_turn_off:
      - ble_server.characteristic.notify:
          id: ble_childlock_char
    web_server:
      sorting_weight: 2
binary_sensor:
  - platform: gpio
    pin:
      number: ${button_pin}
      mode: INPUT_PULLUP
      inverted: true
    name: "Button"
    icon: "mdi:gesture-tap-button"
    internal: true
    on_press:
      - lambda: |-
          if (id(child_lock).state) {
            ESP_LOGW("childlock", "Button press blocked - ChildLock active");
          } else {
            if (id(relay_physical).state) id(relay_physical).turn_off();
            else id(relay_physical).turn_on();
          }