#giturl: "https://github.com/BrAiNeeBug/BrAiNPlug"
#note: the ble project wfbt_base32_brainplug is under construction do not use!
substitutions:
  device_name: brainplug
  friendly_name: "wfbt_base32_brainplug"
  schedule_builder_url: "https://braineebug.github.io/BrAiNPlug/web/wsb.html"
  localdomain: ".local"

esphome:
  comment: BrAiN_Plug_1.5.9_ESP32
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - brainplug_components/ble_auth.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          if (id(power_mode) == 1) {
            if (!id(relay_physical).state) id(relay_physical).turn_on();
          } else if (id(power_mode) == 2) {
            if (id(relay_physical).state) id(relay_physical).turn_off();
          } else {
            if (id(relay_state) == 1) {
              if (!id(relay_physical).state) id(relay_physical).turn_on();
            } else {
              if (id(relay_physical).state) id(relay_physical).turn_off();
            }
          }
      - if:
          condition:
            lambda: 'return id(bluetooth_enable).state;'
          then:
            - ble.enable:
            - lambda: 'id(ble_ever_enabled) = true;'
      - lambda: 'id(booted_flag) = true;'

preferences:
  flash_write_interval: 30s

esp32:
  board: ${esp32_board}
  variant: ${esp32_variant}
  framework:
    type: esp-idf

globals:
  - id: power_mode
    type: int
    restore_value: true
    initial_value: "0"
  - id: timer_mode
    type: int
    restore_value: true
    initial_value: "0"
  - id: last_switch_time
    type: int
    restore_value: true
    initial_value: "0"
  - id: relay_state
    type: int
    restore_value: true
    initial_value: "0"
  - id: weekly_status_str
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: ble_authed
    type: bool
    restore_value: false
    initial_value: "false"
  - id: ble_nonce
    type: std::vector<uint8_t>
    restore_value: false
  - id: ble_auth_failures
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: booted_flag
    type: bool
    restore_value: false
    initial_value: "false"
  - id: ble_ever_enabled
    type: bool
    restore_value: false
    initial_value: "false"
  - id: ble_auth_busy
    type: bool
    restore_value: false
    initial_value: "false"
  - id: ble_auth_ok
    type: bool
    restore_value: false
    initial_value: "false"
  - id: ble_auth_delay_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: time_synced
    type: bool
    restore_value: false
    initial_value: "false"

ota:
  - platform: esphome
    password: !secret ota_password
   # allow_partition_access: true

wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret ap_password
    ap_timeout: 300s
  reboot_timeout: 0s
  power_save_mode: LIGHT
  domain: ${localdomain}

#mqtt:
#  broker: homeassistant.yourdomain
#  id: mqtt_client
#  username: !secret mqtt_username
#  password: !secret mqtt_password

debug:

captive_portal:

logger:
  id: logger_id
  level: VERY_VERBOSE
  initial_level: NONE
  runtime_tag_levels: true

select:
  - platform: logger
    name: "LogLevel"
    id: log_level_select
    disabled_by_default: true
    icon: "mdi:text-box-search-outline"
    entity_category: diagnostic
  - platform: template
    name: "PowerONMode"
    id: power_mode_select
    optimistic: true
    restore_value: true
    options:
      - "Last State"
      - "Always ON"
      - "Always OFF"
    initial_option: "Last State"
    on_value:
      then:
        - lambda: |-
            if (x == "Last State") id(power_mode) = 0;
            else if (x == "Always ON") id(power_mode) = 1;
            else if (x == "Always OFF") id(power_mode) = 2;
    icon: "mdi:cog-clockwise"
    entity_category: config
    web_server:
      sorting_weight: 3
  - platform: template
    name: "TimerMode"
    id: timer_mode_select
    optimistic: true
    restore_value: true
    options:
      - "OFF"
      - "Daily"
      - "DailySingle"
      - "Weekly"
      - "WeeklySingle"
      - "Duration"
    initial_option: "OFF"
    on_value:
      then:
        - lambda: |
            if (x == "OFF") id(timer_mode) = 0;
            else if (x == "Daily") id(timer_mode) = 1;
            else if (x == "DailySingle") id(timer_mode) = 2;
            else if (x == "Weekly") id(timer_mode) = 3;
            else if (x == "WeeklySingle") id(timer_mode) = 4;
            else if (x == "Duration") id(timer_mode) = 5;
        - ble_server.characteristic.notify:
            id: ble_timermode_char
    icon: "mdi:timer-cog"
    entity_category: config
    web_server:
      sorting_weight: 4
text:
  - platform: template
    name: "TimerConf"
    id: timer_conf_text
    #   Daily / DailySingle             -> "HH:MM:SS-HH:MM:SS"        z.B. "12:00:00-22:00:00"
    #   Weekly / WeeklySingle -> "HHMM-HHMM:Days;..."       (Format vom Schedule-Builder, siehe ScheduleBuilderURL)
    #   Duration                  -> "HH:MM:SS/HH:MM:SS" (ON/OFF) z.B. "00:00:10/00:00:05"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 255
    icon: "mdi:calendar-clock"
    entity_category: config
    on_value:
      then:
        - ble_server.characteristic.notify:
            id: ble_timerconf_char
    web_server:
      sorting_weight: 5
web_server:
  port: 80
  version: 3
  auth:
    password: !secret webgui_password
    username: admin
    type: digest

# --- BLE control (Web Bluetooth) ---
# Custom GATT service so the plug can be controlled straight from a browser
# (navigator.bluetooth) without a dedicated app, alongside the existing WiFi API/HA.
# NOTE: the "power", "voltage", "current" and "energy" characteristics assume this file
# is packaged together with pwrmeter-brainplug.yaml (ids: power_sensor, voltage_sensor,
# current_sensor, total_energy_display) as it is for the Nous A8T - if a given ESP32
# device doesn't include that package, remove those four characteristic blocks.
esp32_ble:
  enable_on_boot: false  # BLE stack stays off until the "Bluetooth" switch enables it
esp32_ble_server:
  manufacturer:
    data: n/a
  model:
    data: n/a
  firmware_version:
    data: n/a
  on_connect:
    - lambda: |-
        id(ble_authed) = false;
        id(ble_nonce) = ble_random_nonce(16);
  on_disconnect:
    - lambda: |-
        id(ble_authed) = false;
  services:
    - uuid: a36c6568-2877-466d-ad19-bdbf301199a8
      advertise: true
      characteristics:
        - id: ble_nonce_char
          uuid: 61dd1e94-be40-4e87-a958-471fbe096b3e
          read: true
          notify: true
          value:
            data: !lambda 'return id(ble_nonce);'
        - id: ble_auth_char
          uuid: bff96ad9-2846-45e8-9912-3916a6ddf141
          read: true
          notify: true
          value:
            data: !lambda 'return std::vector<uint8_t>{ (uint8_t) (id(ble_authed) ? 1 : 0) };'
        - id: ble_response_char
          uuid: 8f439555-8033-41ef-af6d-c340b4c9a7de
          write: true
          on_write:
            then:
              - if:
                  condition:
                    lambda: 'return !id(ble_auth_busy);'
                  then:
                    - lambda: 'id(ble_auth_busy) = true;'
                    - lambda: |-
                        std::vector<uint8_t> response(x.begin(), x.end());
                        id(ble_auth_ok) = ble_hmac_verify("${ble_pin}", id(ble_nonce), response);

                        // Backoff wird IMMER aus dem aktuellen Fail-Stand berechnet -
                        // egal ob dieser Versuch richtig war. So verrät die
                        // Antwortzeit nichts über das Ergebnis.
                        uint8_t projected = id(ble_auth_failures);
                        if (!id(ble_auth_ok) && projected < 10) projected++;

                        if (projected == 0) id(ble_auth_delay_ms) = 150;
                        else if (projected >= 6) id(ble_auth_delay_ms) = 60000;
                        else id(ble_auth_delay_ms) = 2000UL << (projected - 1);

                        id(ble_auth_failures) = projected; // vorläufig, wird bei Erfolg unten resettet

                    - delay: !lambda 'return id(ble_auth_delay_ms);'

                    - lambda: |-
                        // Erst JETZT, nach dem einheitlichen Delay, wird der
                        // tatsächliche Zustand sichtbar/lesbar geändert.
                        if (id(ble_auth_ok)) {
                          id(ble_authed) = true;
                          id(ble_auth_failures) = 0;
                          ESP_LOGI("ble_auth", "Client authenticated");
                        } else {
                          id(ble_authed) = false;
                          ESP_LOGW("ble_auth", "BLE auth failed (%u. Fehlversuch)",
                                   (unsigned)id(ble_auth_failures));
                        }
                        id(ble_nonce) = ble_random_nonce(16);

                    - ble_server.characteristic.notify:
                        id: ble_auth_char
                    - ble_server.characteristic.notify:
                        id: ble_nonce_char
                    - lambda: 'id(ble_auth_busy) = false;'
        - id: ble_relay_char
          uuid: b2fbcf01-888c-4dbd-a0ca-9c59855115a6
          read: true
          write: true
          notify: true
          value:
            data: !lambda |-
              if (!id(ble_authed)) return std::vector<uint8_t>{0xFF};
              return std::vector<uint8_t>{ (uint8_t) (id(relay).state ? 1 : 0) };
          on_write:
            then:
              - if:
                  condition:
                    lambda: 'return id(ble_authed);'
                  then:
                    - if:
                        condition:
                          lambda: 'return x.size() > 0 && x[0] == 1;'
                        then:
                          - switch.turn_on: relay
                        else:
                          - switch.turn_off: relay
                  else:
                    - lambda: 'ESP_LOGW("ble_auth", "Relay write rejected - not authenticated");'
        - id: ble_childlock_char
          uuid: 9745e8b8-7ffb-44f8-adfa-e986ee933a8f
          read: true
          write: true
          notify: true
          value:
            data: !lambda |-
              if (!id(ble_authed)) return std::vector<uint8_t>{0xFF};
              return std::vector<uint8_t>{ (uint8_t) (id(child_lock).state ? 1 : 0) };
          on_write:
            then:
              - if:
                  condition:
                    lambda: 'return id(ble_authed);'
                  then:
                    - if:
                        condition:
                          lambda: 'return x.size() > 0 && x[0] == 1;'
                        then:
                          - switch.turn_on: child_lock
                        else:
                          - switch.turn_off: child_lock
                  else:
                    - lambda: 'ESP_LOGW("ble_auth", "ChildLock write rejected - not authenticated");'
        - id: ble_powermode_char
          uuid: 5a2c9438-6e1b-4f83-9a02-7dfb1c5e8a3c
          read: true
          write: true
          notify: true
          value:
            data: !lambda |-
              if (!id(ble_authed)) return std::vector<uint8_t>{};
              std::string s = id(power_mode_select).current_option();
              return std::vector<uint8_t>(s.begin(), s.end());
          on_write:
            then:
              - if:
                  condition:
                    lambda: 'return id(ble_authed);'
                  then:
                    - select.set:
                        id: power_mode_select
                        option: !lambda 'return std::string(x.begin(), x.end());'
                  else:
                    - lambda: 'ESP_LOGW("ble_auth", "PowerONMode write rejected - not authenticated");'
        - id: ble_timermode_char
          uuid: 1bb6e309-c3df-4fd7-88d8-96039201b1db
          read: true
          write: true
          notify: true
          value:
            data: !lambda |-
              if (!id(ble_authed)) return std::vector<uint8_t>{};
              std::string s = id(timer_mode_select).current_option();
              return std::vector<uint8_t>(s.begin(), s.end());
          on_write:
            then:
              - if:
                  condition:
                    lambda: 'return id(ble_authed);'
                  then:
                    - select.set:
                        id: timer_mode_select
                        option: !lambda 'return std::string(x.begin(), x.end());'
                  else:
                    - lambda: 'ESP_LOGW("ble_auth", "TimerMode write rejected - not authenticated");'
        - id: ble_timerconf_char
          uuid: 2bc4d2fc-4a0e-4d00-8bf3-1a25656eb587
          read: true
          write: true
          notify: true
          value:
            data: !lambda |-
              if (!id(ble_authed)) return std::vector<uint8_t>{};
              std::string s = id(timer_conf_text).state;
              return std::vector<uint8_t>(s.begin(), s.end());
          on_write:
            then:
              - if:
                  condition:
                    lambda: 'return id(ble_authed);'
                  then:
                    - text.set:
                        id: timer_conf_text
                        value: !lambda 'return std::string(x.begin(), x.end());'
                  else:
                    - lambda: 'ESP_LOGW("ble_auth", "TimerConf write rejected - not authenticated");'
        - id: ble_power_char
          uuid: 18074a57-a3ba-49a6-a958-d49525bb9434
          read: true
          value:
            data: !lambda |-
              if (!id(ble_authed)) return std::vector<uint8_t>{};
              return bytebuffer::ByteBuffer::wrap(id(power_sensor).state).get_data();
        - id: ble_voltage_char
          uuid: eef5b493-e0b5-4257-b79f-5945b52fc4b4
          read: true
          value:
            data: !lambda |-
              if (!id(ble_authed)) return std::vector<uint8_t>{};
              return bytebuffer::ByteBuffer::wrap(id(voltage_sensor).state).get_data();
        - id: ble_current_char
          uuid: e512c5a0-e726-478f-94ae-e19218f60118
          read: true
          value:
            data: !lambda |-
              if (!id(ble_authed)) return std::vector<uint8_t>{};
              return bytebuffer::ByteBuffer::wrap(id(current_sensor).state).get_data();
        - id: ble_energy_char
          uuid: d3134b34-4635-4d72-9e50-49053be2bc19
          read: true
          value:
            data: !lambda |-
              if (!id(ble_authed)) return std::vector<uint8_t>{};
              return bytebuffer::ByteBuffer::wrap(id(total_energy_display).state).get_data();
        - id: ble_actualduration_char
          uuid: f848732a-d062-457c-aa8e-66c1b5e5fa2e
          read: true
          value:
            data: !lambda |-
              if (!id(ble_authed)) return std::vector<uint8_t>{};
              std::string s = id(relay_duration_display).state;
              return std::vector<uint8_t>(s.begin(), s.end());
        - id: ble_wifisignal_char
          uuid: 8e0f6a15-2b9d-4a1e-9c3f-7d5b0e2a4f6c
          read: true
          value:
            data: !lambda |-
              if (!id(ble_authed)) return std::vector<uint8_t>{};
              return bytebuffer::ByteBuffer::wrap(id(wifi_signal_rssi).state).get_data();
        - id: ble_timerstatus_char
          uuid: 4195b034-6b66-4b12-82d2-5a8e28d4984f
          read: true
          notify: true
          value:
            data: !lambda |-
              if (!id(ble_authed)) return std::vector<uint8_t>{};
              std::string s;
              if (id(timer_mode) == 0) {
                s = "OFF";
              } else if (!id(time_synced)) {
                s = "No time sync";
              } else {
                s = "Active";
              }
              return std::vector<uint8_t>(s.begin(), s.end());

  max_clients: 2
time:
  - platform: sntp
    id: timesrc

interval:
  - interval: 5s
    then:
      - lambda: |
          auto now = id(timesrc).now();
          id(time_synced) = now.is_valid();
          if (!now.is_valid()) return;

          if (id(timer_mode) == 0) {
            return;
          }

          int now_min = now.hour * 60 + now.minute;
          int now_sec = now.hour * 3600 + now.minute * 60 + now.second;

          if (id(timer_mode) == 1 || id(timer_mode) == 2) {
            std::string conf = id(timer_conf_text).state;
            int on_h, on_m, on_s, off_h, off_m, off_s;
            if (sscanf(conf.c_str(), "%d:%d:%d-%d:%d:%d", &on_h, &on_m, &on_s, &off_h, &off_m, &off_s) != 6) {
              return;
            }

            int on_sec  = on_h * 3600 + on_m * 60 + on_s;
            int off_sec = off_h * 3600 + off_m * 60 + off_s;

            if (on_sec == off_sec) {
              return;
            }

            if (id(timer_mode) == 1) {
              int duration = off_sec - on_sec;
              if (duration <= 0) {
                duration += 24 * 3600;
              }

              int elapsed = now_sec - on_sec;
              if (elapsed < 0) {
                elapsed += 24 * 3600;
              }

              bool should_be_on = (elapsed < duration);

              if (should_be_on)
                id(relay_physical).turn_on();
              else
                id(relay_physical).turn_off();
            } else {
              if (now.hour == on_h && now.minute == on_m && now.second < 10) {
                id(relay_physical).turn_on();
              }

              if (now.hour == off_h && now.minute == off_m && now.second < 10) {
                id(relay_physical).turn_off();
              }
            }
          }

          if (id(timer_mode) == 3 || id(timer_mode) == 4) {
            std::string sched = id(timer_conf_text).state;
            const char *dow_tok_arr[] = {"", "Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"};
            std::string dow_tok = dow_tok_arr[now.day_of_week];

            bool should_be_on = false;
            int matched_today = 0;
            size_t pos = 0;
            while (pos <= sched.size()) {
              size_t sep = sched.find(';', pos);
              std::string entry = (sep == std::string::npos) ? sched.substr(pos) : sched.substr(pos, sep - pos);
              pos = (sep == std::string::npos) ? sched.size() + 1 : sep + 1;

              while (!entry.empty() && entry.front() == ' ') entry.erase(entry.begin());
              while (!entry.empty() && entry.back() == ' ') entry.pop_back();
              if (entry.empty()) continue;

              size_t colon = entry.find(':');
              if (colon == std::string::npos) continue;
              std::string range = entry.substr(0, colon);
              std::string days = entry.substr(colon + 1);

              size_t dash = range.find('-');
              if (dash == std::string::npos) continue;
              std::string on_str = range.substr(0, dash);
              std::string off_str = range.substr(dash + 1);
              if (on_str.size() != 4 || off_str.size() != 4) continue;
              if (days.find(dow_tok) == std::string::npos) continue;

              int e_on_min = std::stoi(on_str.substr(0, 2)) * 60 + std::stoi(on_str.substr(2, 2));
              int e_off_min = std::stoi(off_str.substr(0, 2)) * 60 + std::stoi(off_str.substr(2, 2));
              if (e_on_min == e_off_min) continue;

              matched_today++;

              if (id(timer_mode) == 4) {
                int e_on_hour = e_on_min / 60, e_on_minute = e_on_min % 60;
                int e_off_hour = e_off_min / 60, e_off_minute = e_off_min % 60;

                if (now.hour == e_on_hour && now.minute == e_on_minute && now.second < 10) {
                  id(relay_physical).turn_on();
                }
                if (now.hour == e_off_hour && now.minute == e_off_minute && now.second < 10) {
                  id(relay_physical).turn_off();
                }
              } else {
                int e_duration = e_off_min - e_on_min;
                if (e_duration <= 0) e_duration += 24 * 60;
                int e_elapsed = now_min - e_on_min;
                if (e_elapsed < 0) e_elapsed += 24 * 60;

                if (e_elapsed < e_duration) should_be_on = true;
              }
            }

            if (id(timer_mode) == 3) {
              if (should_be_on) id(relay_physical).turn_on();
              else id(relay_physical).turn_off();
            }

            char status_buf[48];
            snprintf(status_buf, sizeof(status_buf), "%d entries today, relay %s",
                     matched_today, id(relay_physical).state ? "ON" : "OFF");
            id(weekly_status_str) = std::string(status_buf);
          }
      - ble_server.characteristic.notify:
          id: ble_timerstatus_char

  - interval: 5s
    then:
      - lambda: |-
          if (id(timer_mode) != 5) return;
          auto now = id(timesrc).now();
          if (!now.is_valid()) return;
          std::string conf = id(timer_conf_text).state;
          int on_h, on_m, on_s, off_h, off_m, off_s;
          if (sscanf(conf.c_str(), "%d:%d:%d/%d:%d:%d", &on_h, &on_m, &on_s, &off_h, &off_m, &off_s) != 6) return;

          long on_sec  = on_h * 3600L + on_m * 60L + on_s;
          long off_sec = off_h * 3600L + off_m * 60L + off_s;
          long cycle = on_sec + off_sec;
          if (cycle <= 0) return;

          long phase = now.timestamp % cycle;
          if (phase < on_sec)
            id(relay_physical).turn_on();
          else
            id(relay_physical).turn_off();

  - interval: 500ms
    then:
      - lambda: |-
          static bool blink_state = false;
          if (!id(wifi_component).is_connected()) {
            blink_state = !blink_state;
            if (blink_state) id(led_out).turn_on();
            else id(led_out).turn_off();
          } else {
            if (id(relay_physical).state) id(led_out).turn_on();
            else id(led_out).turn_off();
          }

text_sensor:
  - platform: debug
    reset_reason:
      id: reset_reason_sensor
      internal: true
      on_value:
        then:
          - lambda: |-
              std::string r = x;
              for (auto &c : r) c = tolower(c);
              if (r.find("power on") != std::string::npos || r.find("brownout") != std::string::npos) {
                id(last_switch_time) = 0;
              }
  - platform: template
    name: "ScheduleBuilderURL"
    id: wsb
    icon: "mdi:web"
    entity_category: diagnostic
    lambda: |-
      return {"${schedule_builder_url}"};
    disabled_by_default: true
  - platform: template
    name: "SystemClock"
    id: current_time_display
    update_interval: 5s
    icon: "mdi:clock-outline"
    lambda: |-
      auto now = id(timesrc).now();
      if (!now.is_valid()) return {"NA"};
      char buf[16];
      snprintf(buf, sizeof(buf), "%02d:%02d:%02d", now.hour, now.minute, now.second);
      return std::string(buf);
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "ActualDuration"
    id: relay_duration_display
    lambda: |-
      auto now = id(timesrc).now();
      if (!now.is_valid()) return {"NA"};

      int elapsed = (int) now.timestamp - id(last_switch_time);

      if (elapsed < 0 || elapsed > 315360000) {
        return std::string("PwrLoss");
      }

      int hours = elapsed / 3600;
      int minutes = (elapsed % 3600) / 60;

      char buf[16];
      snprintf(buf, sizeof(buf), "%dh %dm", hours, minutes);
      return std::string(buf);
    icon: "mdi:run"
    web_server:
      sorting_weight: 6
    update_interval: 5min
  - platform: template
    name: "WeeklyStatus"
    id: weekly_status_display
    icon: "mdi:calendar-check-outline"
    lambda: |-
      return id(weekly_status_str);
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "Timer0NDuration"
    id: timer_on_duration_display
    update_interval: 5s
    lambda: |-
      std::string conf = id(timer_conf_text).state;
      int on_h, on_m, on_s, off_h, off_m, off_s;
      char buf[16];
      if (id(timer_mode) == 5) {
        if (sscanf(conf.c_str(), "%d:%d:%d/%d:%d:%d", &on_h, &on_m, &on_s, &off_h, &off_m, &off_s) != 6)
          return std::string("--");
        long total_sec = on_h * 3600L + on_m * 60L + on_s;
        if (total_sec < 60) snprintf(buf, sizeof(buf), "%lds", total_sec);
        else if (total_sec < 3600) snprintf(buf, sizeof(buf), "%ldm %lds", total_sec / 60, total_sec % 60);
        else snprintf(buf, sizeof(buf), "%ldh %ldm", total_sec / 3600, (total_sec % 3600) / 60);
        return std::string(buf);
      }
      if (sscanf(conf.c_str(), "%d:%d:%d-%d:%d:%d", &on_h, &on_m, &on_s, &off_h, &off_m, &off_s) != 6)
        return std::string("--");
      int on_sec = on_h * 3600 + on_m * 60 + on_s;
      int off_sec = off_h * 3600 + off_m * 60 + off_s;
      int duration = off_sec - on_sec;
      if (duration < 0) duration += 24 * 3600;
      snprintf(buf, sizeof(buf), "%.1fh", floor(duration / 3600.0 * 10) / 10.0);
      return std::string(buf);
    icon: "mdi:emoticon-cool"
    web_server:
      sorting_weight: 7
  - platform: template
    name: "TimerOFFDuration"
    id: timer_off_duration_display
    update_interval: 5s
    lambda: |-
      std::string conf = id(timer_conf_text).state;
      int on_h, on_m, on_s, off_h, off_m, off_s;
      char buf[16];
      if (id(timer_mode) == 5) {
        if (sscanf(conf.c_str(), "%d:%d:%d/%d:%d:%d", &on_h, &on_m, &on_s, &off_h, &off_m, &off_s) != 6)
          return std::string("--");
        long total_sec = off_h * 3600L + off_m * 60L + off_s;
        if (total_sec < 60) snprintf(buf, sizeof(buf), "%lds", total_sec);
        else if (total_sec < 3600) snprintf(buf, sizeof(buf), "%ldm %lds", total_sec / 60, total_sec % 60);
        else snprintf(buf, sizeof(buf), "%ldh %ldm", total_sec / 3600, (total_sec % 3600) / 60);
        return std::string(buf);
      }
      if (sscanf(conf.c_str(), "%d:%d:%d-%d:%d:%d", &on_h, &on_m, &on_s, &off_h, &off_m, &off_s) != 6)
        return std::string("--");
      int on_sec = on_h * 3600 + on_m * 60 + on_s;
      int off_sec = off_h * 3600 + off_m * 60 + off_s;
      int duration = on_sec - off_sec;
      if (duration < 0) duration += 24 * 3600;
      snprintf(buf, sizeof(buf), "%.1fh", floor(duration / 3600.0 * 10) / 10.0);
      return std::string(buf);
    icon: "mdi:weather-night"
