#giturl: "https://github.com/BrAiNeeBug/BrAiNPlug"
substitutions:
  device_name: brainplug
  friendly_name: "base32_brainplug"
  schedule_builder_url: "https://braineebug.github.io/BrAiNPlug/web/wsb.html"
  localdomain: ".local"
  mqttbroker: "homeassistant.local"

esphome:
  comment: BrAiN_Plug_1.4.3_ESP32
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          if (id(power_mode) == 1) {
            if (!id(relay_physical).state) id(relay_physical).turn_on();
          } else if (id(power_mode) == 2) {
            if (id(relay_physical).state) id(relay_physical).turn_off();
          } else {
            if (id(relay_state) == 1) {
              if (!id(relay_physical).state) id(relay_physical).turn_on();
            } else {
              if (id(relay_physical).state) id(relay_physical).turn_off();
            }
          }

preferences:
  flash_write_interval: 30s

esp32:
  board: ${esp32_board}
  variant: ${esp32_variant}
  framework:
    type: esp-idf

globals:
  - id: power_mode
    type: int
    restore_value: true
    initial_value: "0"
  - id: timer_mode
    type: int
    restore_value: true
    initial_value: "0"
  - id: last_switch_time
    type: int
    restore_value: true
    initial_value: "0"
  - id: relay_state
    type: int
    restore_value: true
    initial_value: "0"
  - id: weekly_status_str
    type: std::string
    restore_value: false
    initial_value: '""'

ota:
  - platform: esphome
    password: !secret ota_password
   # allow_partition_access: true

wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret ap_password
    ap_timeout: 300s
  reboot_timeout: 0s
  power_save_mode: LIGHT
  domain: ${localdomain}

mqtt:
  broker: ${mqttbroker}
  id: mqtt_client
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: ${device_name}

debug:

captive_portal:

logger:
  id: logger_id
  level: VERY_VERBOSE
  initial_level: NONE
  runtime_tag_levels: true

select:
  - platform: logger
    name: "LogLevel"
    id: log_level_select
    disabled_by_default: true
    icon: "mdi:text-box-search-outline"
    entity_category: diagnostic
  - platform: template
    name: "PowerONMode"
    id: power_mode_select
    optimistic: true
    restore_value: true
    options:
      - "Last State"
      - "Always ON"
      - "Always OFF"
    initial_option: "Last State"
    on_value:
      then:
        - lambda: |-
            if (x == "Last State") id(power_mode) = 0;
            else if (x == "Always ON") id(power_mode) = 1;
            else if (x == "Always OFF") id(power_mode) = 2;
    icon: "mdi:cog-clockwise"
    entity_category: config
    web_server:
      sorting_weight: 2
  - platform: template
    name: "TimerMode"
    id: timer_mode_select
    optimistic: true
    restore_value: true
    options:
      - "OFF"
      - "Daily"
      - "DailySingle"
      - "Weekly"
      - "WeeklySingle"
      - "Duration"
    initial_option: "OFF"
    on_value:
      then:
        - lambda: |
            if (x == "OFF") id(timer_mode) = 0;
            else if (x == "Daily") id(timer_mode) = 1;
            else if (x == "DailySingle") id(timer_mode) = 2;
            else if (x == "Weekly") id(timer_mode) = 3;
            else if (x == "WeeklySingle") id(timer_mode) = 4;
            else if (x == "Duration") id(timer_mode) = 5;
    icon: "mdi:timer-cog"
    entity_category: config
    web_server:
      sorting_weight: 3
text:
  - platform: template
    name: "TimerConf"
    id: timer_conf_text
    #   Daily / DailySingle             -> "HH:MM:SS-HH:MM:SS"        z.B. "12:00:00-22:00:00"
    #   Weekly / WeeklySingle -> "HHMM-HHMM:Days;..."       (Format vom Schedule-Builder, siehe ScheduleBuilderURL)
    #   Duration                  -> "HH:MM:SS/HH:MM:SS" (ON/OFF) z.B. "00:00:10/00:00:05"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 255
    icon: "mdi:calendar-clock"
    entity_category: config
    web_server:
      sorting_weight: 4
web_server:
  port: 80
  version: 3
  auth:
    password: !secret webgui_password
    username: admin
    type: digest

time:
  - platform: sntp
    id: timesrc

interval:
  - interval: 10s
    then:
      - lambda: |
          auto now = id(timesrc).now();
          if (!now.is_valid()) return;

          if (id(timer_mode) == 0) {
            return;
          }

          int now_min = now.hour * 60 + now.minute;
          int now_sec = now.hour * 3600 + now.minute * 60 + now.second;

          if (id(timer_mode) == 1 || id(timer_mode) == 2) {
            std::string conf = id(timer_conf_text).state;
            int on_h, on_m, on_s, off_h, off_m, off_s;
            if (sscanf(conf.c_str(), "%d:%d:%d-%d:%d:%d", &on_h, &on_m, &on_s, &off_h, &off_m, &off_s) != 6) {
              return;
            }

            int on_sec  = on_h * 3600 + on_m * 60 + on_s;
            int off_sec = off_h * 3600 + off_m * 60 + off_s;

            if (on_sec == off_sec) {
              return;
            }

            if (id(timer_mode) == 1) {
              int duration = off_sec - on_sec;
              if (duration <= 0) {
                duration += 24 * 3600;
              }

              int elapsed = now_sec - on_sec;
              if (elapsed < 0) {
                elapsed += 24 * 3600;
              }

              bool should_be_on = (elapsed < duration);

              if (should_be_on)
                id(relay_physical).turn_on();
              else
                id(relay_physical).turn_off();
            } else {
              if (now.hour == on_h && now.minute == on_m && now.second < 10) {
                id(relay_physical).turn_on();
              }

              if (now.hour == off_h && now.minute == off_m && now.second < 10) {
                id(relay_physical).turn_off();
              }
            }
          }

          if (id(timer_mode) == 3 || id(timer_mode) == 4) {
            std::string sched = id(timer_conf_text).state;
            const char *dow_tok_arr[] = {"", "Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"};
            std::string dow_tok = dow_tok_arr[now.day_of_week];

            bool should_be_on = false;
            int matched_today = 0;
            size_t pos = 0;
            while (pos <= sched.size()) {
              size_t sep = sched.find(';', pos);
              std::string entry = (sep == std::string::npos) ? sched.substr(pos) : sched.substr(pos, sep - pos);
              pos = (sep == std::string::npos) ? sched.size() + 1 : sep + 1;

              while (!entry.empty() && entry.front() == ' ') entry.erase(entry.begin());
              while (!entry.empty() && entry.back() == ' ') entry.pop_back();
              if (entry.empty()) continue;

              size_t colon = entry.find(':');
              if (colon == std::string::npos) continue;
              std::string range = entry.substr(0, colon);
              std::string days = entry.substr(colon + 1);

              size_t dash = range.find('-');
              if (dash == std::string::npos) continue;
              std::string on_str = range.substr(0, dash);
              std::string off_str = range.substr(dash + 1);
              if (on_str.size() != 4 || off_str.size() != 4) continue;
              if (days.find(dow_tok) == std::string::npos) continue;

              int e_on_min = std::stoi(on_str.substr(0, 2)) * 60 + std::stoi(on_str.substr(2, 2));
              int e_off_min = std::stoi(off_str.substr(0, 2)) * 60 + std::stoi(off_str.substr(2, 2));
              if (e_on_min == e_off_min) continue;

              matched_today++;

              if (id(timer_mode) == 4) {
                int e_on_hour = e_on_min / 60, e_on_minute = e_on_min % 60;
                int e_off_hour = e_off_min / 60, e_off_minute = e_off_min % 60;

                if (now.hour == e_on_hour && now.minute == e_on_minute && now.second < 10) {
                  id(relay_physical).turn_on();
                }
                if (now.hour == e_off_hour && now.minute == e_off_minute && now.second < 10) {
                  id(relay_physical).turn_off();
                }
              } else {
                int e_duration = e_off_min - e_on_min;
                if (e_duration <= 0) e_duration += 24 * 60;
                int e_elapsed = now_min - e_on_min;
                if (e_elapsed < 0) e_elapsed += 24 * 60;

                if (e_elapsed < e_duration) should_be_on = true;
              }
            }

            if (id(timer_mode) == 3) {
              if (should_be_on) id(relay_physical).turn_on();
              else id(relay_physical).turn_off();
            }

            char status_buf[48];
            snprintf(status_buf, sizeof(status_buf), "%d entries today, relay %s",
                     matched_today, id(relay_physical).state ? "ON" : "OFF");
            id(weekly_status_str) = std::string(status_buf);
          }

  - interval: 1s
    then:
      - lambda: |-
          if (id(timer_mode) != 5) return;
          auto now = id(timesrc).now();
          if (!now.is_valid()) return;
          std::string conf = id(timer_conf_text).state;
          int on_h, on_m, on_s, off_h, off_m, off_s;
          if (sscanf(conf.c_str(), "%d:%d:%d/%d:%d:%d", &on_h, &on_m, &on_s, &off_h, &off_m, &off_s) != 6) return;

          long on_sec  = on_h * 3600L + on_m * 60L + on_s;
          long off_sec = off_h * 3600L + off_m * 60L + off_s;
          long cycle = on_sec + off_sec;
          if (cycle <= 0) return;

          long phase = now.timestamp % cycle;
          if (phase < on_sec)
            id(relay_physical).turn_on();
          else
            id(relay_physical).turn_off();

  - interval: 500ms
    then:
      - lambda: |-
          static bool blink_state = false;
          if (!id(wifi_component).is_connected()) {
            blink_state = !blink_state;
            if (blink_state) id(led_out).turn_on();
            else id(led_out).turn_off();
          } else {
            if (id(relay_physical).state) id(led_out).turn_on();
            else id(led_out).turn_off();
          }

text_sensor:
  - platform: debug
    reset_reason:
      id: reset_reason_sensor
      internal: true
      on_value:
        then:
          - lambda: |-
              std::string r = x;
              for (auto &c : r) c = tolower(c);
              if (r.find("power on") != std::string::npos || r.find("brownout") != std::string::npos) {
                id(last_switch_time) = 0;
              }
  - platform: template
    name: "ScheduleBuilderURL"
    id: wsb
    icon: "mdi:web"
    entity_category: diagnostic
    lambda: |-
      return {"${schedule_builder_url}"};
    disabled_by_default: true
  - platform: template
    name: "SystemClock"
    id: current_time_display
    icon: "mdi:clock-outline"
    lambda: |-
      auto now = id(timesrc).now();
      if (!now.is_valid()) return {"NA"};
      char buf[16];
      snprintf(buf, sizeof(buf), "%02d:%02d:%02d", now.hour, now.minute, now.second);
      return std::string(buf);
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "ActualDuration"
    id: relay_duration_display
    state_topic: "${device_name}/text_sensor/actualduration/state" #needed for mqtt idk..
    lambda: |-
      auto now = id(timesrc).now();
      if (!now.is_valid()) return {"NA"};

      int elapsed = (int) now.timestamp - id(last_switch_time);

      if (elapsed < 0 || elapsed > 315360000) {
        return std::string("PwrLoss");
      }

      int hours = elapsed / 3600;
      int minutes = (elapsed % 3600) / 60;

      char buf[16];
      snprintf(buf, sizeof(buf), "%dh %dm", hours, minutes);
      return std::string(buf);
    icon: "mdi:run"
    web_server:
      sorting_weight: 6
  - platform: template
    name: "WeeklyStatus"
    id: weekly_status_display
    icon: "mdi:calendar-check-outline"
    lambda: |-
      return id(weekly_status_str);
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "Timer0NDuration"
    id: timer_on_duration_display
    update_interval: 5s
    lambda: |-
      std::string conf = id(timer_conf_text).state;
      int on_h, on_m, on_s, off_h, off_m, off_s;
      char buf[16];
      if (id(timer_mode) == 5) {
        if (sscanf(conf.c_str(), "%d:%d:%d/%d:%d:%d", &on_h, &on_m, &on_s, &off_h, &off_m, &off_s) != 6)
          return std::string("--");
        long total_sec = on_h * 3600L + on_m * 60L + on_s;
        if (total_sec < 60) snprintf(buf, sizeof(buf), "%lds", total_sec);
        else if (total_sec < 3600) snprintf(buf, sizeof(buf), "%ldm %lds", total_sec / 60, total_sec % 60);
        else snprintf(buf, sizeof(buf), "%ldh %ldm", total_sec / 3600, (total_sec % 3600) / 60);
        return std::string(buf);
      }
      if (sscanf(conf.c_str(), "%d:%d:%d-%d:%d:%d", &on_h, &on_m, &on_s, &off_h, &off_m, &off_s) != 6)
        return std::string("--");
      int on_sec = on_h * 3600 + on_m * 60 + on_s;
      int off_sec = off_h * 3600 + off_m * 60 + off_s;
      int duration = off_sec - on_sec;
      if (duration < 0) duration += 24 * 3600;
      snprintf(buf, sizeof(buf), "%.1fh", floor(duration / 3600.0 * 10) / 10.0);
      return std::string(buf);
    icon: "mdi:emoticon-cool"
    web_server:
      sorting_weight: 7
  - platform: template
    name: "TimerOFFDuration"
    id: timer_off_duration_display
    update_interval: 5s
    lambda: |-
      std::string conf = id(timer_conf_text).state;
      int on_h, on_m, on_s, off_h, off_m, off_s;
      char buf[16];
      if (id(timer_mode) == 5) {
        if (sscanf(conf.c_str(), "%d:%d:%d/%d:%d:%d", &on_h, &on_m, &on_s, &off_h, &off_m, &off_s) != 6)
          return std::string("--");
        long total_sec = off_h * 3600L + off_m * 60L + off_s;
        if (total_sec < 60) snprintf(buf, sizeof(buf), "%lds", total_sec);
        else if (total_sec < 3600) snprintf(buf, sizeof(buf), "%ldm %lds", total_sec / 60, total_sec % 60);
        else snprintf(buf, sizeof(buf), "%ldh %ldm", total_sec / 3600, (total_sec % 3600) / 60);
        return std::string(buf);
      }
      if (sscanf(conf.c_str(), "%d:%d:%d-%d:%d:%d", &on_h, &on_m, &on_s, &off_h, &off_m, &off_s) != 6)
        return std::string("--");
      int on_sec = on_h * 3600 + on_m * 60 + on_s;
      int off_sec = off_h * 3600 + off_m * 60 + off_s;
      int duration = on_sec - off_sec;
      if (duration < 0) duration += 24 * 3600;
      snprintf(buf, sizeof(buf), "%.1fh", floor(duration / 3600.0 * 10) / 10.0);
      return std::string(buf);
    icon: "mdi:weather-night"
    web_server:
      sorting_weight: 8
  - platform: wifi_info
    ssid:
      name: "WiFiSSID"
      icon: "mdi:wifi"
      entity_category: diagnostic
      disabled_by_default: true
    ip_address:
      name: "WiFiIP"
      icon: "mdi:ip-network"
      entity_category: diagnostic
      disabled_by_default: true
button:
  - platform: restart
    name: "Restart"
    device_class: restart
    entity_category: diagnostic
    disabled_by_default: true
    icon: "mdi:restart"

sensor:
  - platform: wifi_signal
    name: "WiFiSignal"
    id: wifi_signal_rssi
    update_interval: 30s
    entity_category: diagnostic
    icon: "mdi:wifi-strength-2"
    disabled_by_default: true

#############################################
##########  Plug: Relay/Button/LED  ##########
#############################################

output:
  - platform: gpio
    pin: ${relay_pin}
    id: relay_out
  - platform: gpio
    pin:
      number: ${led_pin}
      inverted: true
      ignore_strapping_warning: true
    id: led_out

switch:
  - platform: output
    name: "RelayPhysical"
    output: relay_out
    id: relay_physical
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          id(relay_state) = 1;
          auto now = id(timesrc).now();
          if (now.is_valid()) {
            id(last_switch_time) = (int) now.timestamp;
          }
          global_preferences->sync();
          id(relay).publish_state(true);
    on_turn_off:
      - lambda: |-
          id(relay_state) = 0;
          auto now = id(timesrc).now();
          if (now.is_valid()) {
            id(last_switch_time) = (int) now.timestamp;
          }
          global_preferences->sync();
          id(relay).publish_state(false);
  - platform: template
    name: "Switch"
    id: relay
    restore_mode: DISABLED  # reiner Anzeige-/Gate-Layer, echter Zustand kommt von relay_physical
    icon: "mdi:power-socket-eu"
    turn_on_action:
      - lambda: |-
          if (id(child_lock).state) {
            ESP_LOGW("childlock", "Turn ON blocked - ChildLock active");
            id(relay).publish_state(id(relay_physical).state);
          } else {
            id(relay_physical).turn_on();
          }
    turn_off_action:
      - lambda: |-
          if (id(child_lock).state) {
            ESP_LOGW("childlock", "Turn OFF blocked - ChildLock active");
            id(relay).publish_state(id(relay_physical).state);
          } else {
            id(relay_physical).turn_off();
          }
    web_server:
      sorting_weight: 1
  - platform: template
    name: "ChildLock"
    id: child_lock
    icon: "mdi:lock"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_weight: 1
binary_sensor:
  - platform: gpio
    pin:
      number: ${button_pin}
      mode: INPUT_PULLUP
      inverted: true
    name: "Button"
    icon: "mdi:gesture-tap-button"
    internal: true
    on_press:
      - lambda: |-
          if (id(child_lock).state) {
            ESP_LOGW("childlock", "Button press blocked - ChildLock active");
          } else {
            if (id(relay_physical).state) id(relay_physical).turn_off();
            else id(relay_physical).turn_on();
          }